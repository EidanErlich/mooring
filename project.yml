name: Mooring
options:
  bundleIdPrefix: dev.mooring
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: 9.0.9
  AwakeKit:
    path: Packages/AwakeKit
  MooringIPC:
    path: Packages/MooringIPC
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  Mooring:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/UI
      - App/Settings
      - App/Assets.xcassets
      - Helper/Shared
      - App/Helper
      - App/IPC
      - path: Helper/dev.mooring.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: MooringHelper
        embed: true
        link: false
        copy:
          destination: executables
      - target: MooringCLI
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: Defaults
      - package: AwakeKit
      - package: AwakeKit
        product: AwaykeMonitors
      - package: MooringIPC
    postCompileScripts:
      - name: Bundle Claude Code plugin
        script: '"$SRCROOT/scripts/bundle-claude-plugin.sh" "$SRCROOT/Integrations/claude-code-plugin" "$SRCROOT/Integrations/app-marketplace.json" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ClaudePlugin"'
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/ClaudePlugin/.claude-plugin/marketplace.json
        basedOnDependencyAnalysis: false   # the plugin folder is copied whole, so any file in it can change
    settings:
      base:
        PRODUCT_NAME: Mooring
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the bundling script writes into the app bundle
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooring.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES   # blocks DYLD injection into the helper's only client
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MOORING_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MOORING_TEAM)
  MooringHelper:
    type: tool
    platform: macOS
    sources:
      - Helper/Sources
      - Helper/Shared
    preBuildScripts:
      - name: Write helper client requirement
        script: '"$SRCROOT/scripts/write-helper-requirement.sh" "$SRCROOT/Helper/Info.template.plist" "$DERIVED_FILE_DIR/HelperInfo.plist"'
        inputFiles:
          - $(SRCROOT)/Helper/Info.template.plist
          - $(SRCROOT)/scripts/write-helper-requirement.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/HelperInfo.plist
        basedOnDependencyAnalysis: false   # the signing identity can change with no file changing
    settings:
      base:
        PRODUCT_NAME: dev.mooring.helper
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooring.helper
        OTHER_LDFLAGS: -sectcreate __TEXT __info_plist $(DERIVED_FILE_DIR)/HelperInfo.plist
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MOORING_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MOORING_TEAM)
  MooringCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
    dependencies:
      - package: MooringIPC
        product: MooringCLICore
      - package: MooringIPC
        product: MooringIPC
    settings:
      base:
        PRODUCT_NAME: mooring
        PRODUCT_MODULE_NAME: MooringCLITool
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooring.cli
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MOORING_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MOORING_TEAM)
  MooringTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Mooring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooring.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MOORING_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MOORING_TEAM)
  MooringHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Helper/Tests
      - Helper/Sources/PMSet.swift
      - Helper/Sources/ClientRequirement.swift
      - Helper/Sources/Watchdog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mooring.helper.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MOORING_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MOORING_TEAM)
schemes:
  Mooring:
    build:
      targets:
        Mooring: all
    test:
      targets:
        - MooringTests
        - MooringHelperTests
