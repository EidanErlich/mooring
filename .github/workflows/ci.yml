name: CI

on:
  push:
    branches: [main]
  pull_request:

# Private repo: macOS minutes are metered, so drop superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        run: make bootstrap
      - name: Build (unsigned)
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
      - name: Unit tests
        run: make test XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
      - name: Release dry run
        # Proves the release tooling without secrets: no signing, tests or publishing.
        run: |
          scripts/release.sh --dry-run --app build/DerivedData/Build/Products/Debug/Mooring.app
          for f in dist/Mooring-*.zip dist/appcast.xml dist/homebrew/mooring.rb; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          xmllint --noout dist/appcast.xml
      - name: Lint (non-blocking)
        run: make lint
        continue-on-error: true
