# Default rules (docs/SPEC.md). Vendored targets get excluded here as they arrive.
included:
  - App
  - Packages
  - Helper
excluded:
  - build
  - Packages/*/.build
  - Packages/AwakeKit/Sources/AwaykeMonitors   # vendored Awayke code
  - Packages/WindowKit/Sources/WindowKit/Loop   # vendored Loop code
  - Packages/WindowKit/Tests/WindowKitTests/Loop   # vendored Loop tests
  - Packages/ClipKit/Sources/ClipKit/Maccy   # vendored Maccy code
  - Packages/ClipKit/Tests/ClipKitTests/Maccy   # vendored Maccy tests
line_length:
  warning: 140
